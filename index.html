<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3B36"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/ikra-icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style>
<script src="config.js"></script>
</head><body>
<title>OKU</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700&family=Noto+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Cinzel:wght@700&family=Lateef:wght@700&display=swap">
<style>
/* Layout: one phone column. Sign-in screens are a dark teal glass look (language, role, login); the app is parchment and gold with a header, scrolling view, tab bar and drawer. Uyghur and Arabic use Noto Naskh Arabic throughout. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#FCF9EC; --soft2:#F7F6F1;
  --line:#F0E7C4; --line2:#E6E5E0;
  --gold:#C29B00; --gold-d:#8F7000; --gold-ink:#7C6100; --gold-link:#A88600;
  --g1:#C9A700; --g2:#957600; --on-gold:#2A2100;
  --chip:#F7F0D2; --chip-b:#E4D386;
  --ink:#1F1B10; --mute:#6F6A5D;
  --green:#2F6F4F; --green-bg:#E4EFE8; --green-b:#A9C4B3;
  --warn:#8A5D06; --warn-bg:#FBF1DC; --warn-b:#EBD6A0;
  --bad:#B5382E; --bad-bg:#FBE6E3; --bad-b:#EDB9B2;
  --d-g:#2F9E63; --d-y:#E3B21B; --d-r:#D8483C; --d-h:#4A86D8; --hol-bg:#EAF1FC; --d-l:#7C5CC4; --lv-bg:#F1ECFB;
  --hdr1:#FBF8EC; --hdr2:#EFE8D1; --scrim:rgba(24,18,4,.5);
  --shadow:0 6px 18px rgba(143,112,0,.18);
  --au1:#06312E; --au2:#19B3A3; --au-gold:#F2CC45; --au-t:#F6F2DF; --au-m:#B7D4CD; --au-card:rgba(6,49,46,.55); --au-b:rgba(255,255,255,.2);
  --f-ui:'Noto Sans','Segoe UI',system-ui,sans-serif;
  --f-head:'Playfair Display',Georgia,serif;
  --f-latin:'Cinzel',Georgia,serif;
  --f-num:Georgia,'Times New Roman',serif;
  --f-naskh:'Noto Naskh Arabic','Segoe UI',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14110A; --surface:#1D190E; --soft:#221D0F; --soft2:#19160D;
  --line:#3A3216; --line2:#332E1E;
  --gold:#E2BE2C; --gold-d:#D1AE2A; --gold-ink:#E8CC66; --gold-link:#E2BE2C;
  --g1:#E0BC2A; --g2:#B08E10; --on-gold:#1B1500;
  --chip:#2D2610; --chip-b:#5A4A16;
  --ink:#F4EEDB; --mute:#A39D8B;
  --green:#7CC59E; --green-bg:#1C2D24; --green-b:#355B47;
  --warn:#E5B24F; --warn-bg:#2E2410; --warn-b:#5C4718;
  --bad:#F28B80; --bad-bg:#33201E; --bad-b:#6A3630;
  --d-g:#5CCB8D; --d-y:#F0C645; --d-r:#F0776B; --d-h:#7FB0F2; --hol-bg:#17263D; --d-l:#B79BF0; --lv-bg:#241C3A;
  --hdr1:#1F1A0D; --hdr2:#2A230F; --scrim:rgba(0,0,0,.6);
  --shadow:0 6px 18px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110A; --surface:#1D190E; --soft:#221D0F; --soft2:#19160D;
  --line:#3A3216; --line2:#332E1E;
  --gold:#E2BE2C; --gold-d:#D1AE2A; --gold-ink:#E8CC66; --gold-link:#E2BE2C;
  --g1:#E0BC2A; --g2:#B08E10; --on-gold:#1B1500;
  --chip:#2D2610; --chip-b:#5A4A16;
  --ink:#F4EEDB; --mute:#A39D8B;
  --green:#7CC59E; --green-bg:#1C2D24; --green-b:#355B47;
  --warn:#E5B24F; --warn-bg:#2E2410; --warn-b:#5C4718;
  --bad:#F28B80; --bad-bg:#33201E; --bad-b:#6A3630;
  --d-g:#5CCB8D; --d-y:#F0C645; --d-r:#F0776B; --d-h:#7FB0F2; --hol-bg:#17263D; --d-l:#B79BF0; --lv-bg:#241C3A;
  --hdr1:#1F1A0D; --hdr2:#2A230F; --scrim:rgba(0,0,0,.6);
  --shadow:0 6px 18px rgba(0,0,0,.4);
  color-scheme:dark}

:root[data-pal="a"]{--bg:#EAF5EE;--surface:#F7FCF9;--soft:#DDF0E4;--soft2:#E3F1E8;--line:#C3E1CE;--line2:#CBE4D3;--ink:#12281C;--mute:#4F6A5A;--gold:#1E8F4E;--gold-d:#177A41;--gold-ink:#106B38;--gold-link:#1E8F4E;--g1:#2DB267;--g2:#116B3A;--on-gold:#FFFFFF;--chip:#D5EDDD;--chip-b:#98CDAE;--hdr1:#E2F3E8;--hdr2:#C8E6D3;--shadow:0 6px 18px rgba(30,143,78,.18)}
:root[data-pal="a"][data-theme="dark"]{--bg:#0E1A13;--surface:#15261C;--soft:#1A3124;--soft2:#12211A;--line:#27493A;--line2:#223F32;--ink:#E0F0E6;--mute:#8FAE9C;--gold:#4CC884;--gold-d:#38B574;--gold-ink:#7BDCA6;--gold-link:#4CC884;--g1:#4CC884;--g2:#1F8A55;--on-gold:#062314;--chip:#183626;--chip-b:#2C6A48;--hdr1:#13261B;--hdr2:#193325;--shadow:0 6px 18px rgba(0,0,0,.4)}
:root[data-pal="b"]{--bg:#FBF0E6;--surface:#FFFAF4;--soft:#F7E2CF;--soft2:#F8E9DB;--line:#EBCDB0;--line2:#EFD5BC;--ink:#2E1A0E;--mute:#7A5A44;--gold:#C2571A;--gold-d:#A94A14;--gold-ink:#9A430F;--gold-link:#C2571A;--g1:#E07A33;--g2:#9A3E0E;--on-gold:#FFFFFF;--chip:#F9DEC6;--chip-b:#E8B58C;--hdr1:#FAEADA;--hdr2:#F2D3B6;--shadow:0 6px 18px rgba(194,87,26,.2)}
:root[data-pal="b"][data-theme="dark"]{--bg:#1D140D;--surface:#2A1D13;--soft:#34241A;--soft2:#241811;--line:#4D3524;--line2:#41301F;--ink:#F3E6DA;--mute:#B09882;--gold:#F0954F;--gold-d:#E0833A;--gold-ink:#F6B47C;--gold-link:#F0954F;--g1:#F0954F;--g2:#B5561A;--on-gold:#2B1204;--chip:#3A281A;--chip-b:#6E4A2C;--hdr1:#271A10;--hdr2:#33231A;--shadow:0 6px 18px rgba(0,0,0,.45)}
:root[data-pal="c"]{--bg:#ECF7F8;--surface:#F8FDFD;--soft:#DDF1F3;--soft2:#E4F2F3;--line:#C5E4E8;--line2:#CCE5E8;--ink:#142A2E;--mute:#52696E;--gold:#0E8FA3;--gold-d:#0B7D90;--gold-ink:#087486;--gold-link:#0E8FA3;--g1:#25B3C7;--g2:#0A7A8C;--on-gold:#FFFFFF;--chip:#D8F0F3;--chip-b:#9FD6DE;--hdr1:#E6F6F7;--hdr2:#CDEBEE;--shadow:0 6px 18px rgba(14,143,163,.18)}
:root[data-pal="c"][data-theme="dark"]{--bg:#0F1D21;--surface:#162A2F;--soft:#1B363C;--soft2:#13242A;--line:#274850;--line2:#223F46;--ink:#E2F0F2;--mute:#93AEB3;--gold:#3CC8D8;--gold-d:#2BB5C6;--gold-ink:#6FDCE8;--gold-link:#3CC8D8;--g1:#3CC8D8;--g2:#1C8A99;--on-gold:#06242A;--chip:#1A3840;--chip-b:#2F6671;--hdr1:#14262B;--hdr2:#1A3238;--shadow:0 6px 18px rgba(0,0,0,.4)}
:root[data-pal="d"]{--bg:#F1F1F2;--surface:#FFFFFF;--soft:#E8E8EA;--soft2:#EDEDEF;--line:#D6D6DA;--line2:#DCDCDF;--ink:#0D0D0F;--mute:#5B5B62;--gold:#1A1A1F;--gold-d:#000000;--gold-ink:#111114;--gold-link:#1A1A1F;--g1:#3A3A42;--g2:#0D0D0F;--on-gold:#FFFFFF;--chip:#E4E4E7;--chip-b:#BDBDC4;--hdr1:#EDEDEF;--hdr2:#DADADE;--shadow:0 6px 18px rgba(0,0,0,.16)}
:root[data-pal="d"][data-theme="dark"]{--bg:#000000;--surface:#0E0E10;--soft:#16161A;--soft2:#0A0A0C;--line:#26262C;--line2:#202026;--ink:#ECECEF;--mute:#9A9AA3;--gold:#E6E6EA;--gold-d:#D2D2D8;--gold-ink:#F2F2F5;--gold-link:#E6E6EA;--g1:#E6E6EA;--g2:#A9A9B2;--on-gold:#0A0A0C;--chip:#1A1A1F;--chip-b:#3A3A42;--hdr1:#0A0A0C;--hdr2:#131316;--shadow:0 6px 18px rgba(0,0,0,.6)}
:root[data-pal="d"] .hdr{background:linear-gradient(150deg,#26262B 0%,#000000 100%);border-bottom-color:#8E8E96}:root[data-pal="d"] .hdr .menu-btn{color:#E6E6EA}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
bdi{unicode-bidi:isolate}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;font-family:var(--f-ui)}
#app[lang="ug"],#app[lang="ar"]{--f-ui:var(--f-naskh);--f-head:var(--f-naskh);font-size:16.5px;line-height:1.7}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{flex:none;display:block}

/* header */
.hdr{flex:none;background:linear-gradient(180deg,var(--hdr1),var(--hdr2));border-bottom:1px solid var(--line)}
.hdr-in{height:84px;display:flex;align-items:center;gap:14px}
.menu-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.brand{display:flex;align-items:center;gap:14px;align-self:stretch}
.logo{width:54px;height:54px;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;font-family:var(--f-naskh);font-weight:700;font-size:21px;color:var(--gold-d);background:var(--hdr1);box-shadow:var(--shadow);line-height:1;padding-top:6px}
.wordmark{font-family:var(--f-latin);font-weight:700;font-size:27px;letter-spacing:.05em;color:var(--gold-d);direction:ltr}
#app[lang="ug"] .wordmark,#app[lang="ar"] .wordmark{font-family:var(--f-naskh);letter-spacing:0;font-size:32px;line-height:1.2;direction:rtl;padding-top:4px}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.page{padding-block:22px 28px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph>div:first-child{min-width:0;flex:1 1 150px}
.ph>*:not(:first-child){max-width:100%}
.ph h1{overflow-wrap:anywhere}
@media (max-width:480px){.ph>div:first-child{flex-basis:100%}.ph>*:not(:first-child){flex-direction:row!important;flex-wrap:wrap;margin-top:4px}}
h1{margin:0;font-family:var(--f-head);font-weight:700;font-size:30px;line-height:1.3;color:var(--gold-ink);text-wrap:balance}
#app[lang="ug"] h1,#app[lang="ar"] h1{font-size:25px;line-height:1.5}
.sub{margin:2px 0 0;color:var(--mute);font-size:15.5px}
h2{font-family:var(--f-head)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on-gold);font-weight:600;font-size:16px;box-shadow:var(--shadow)}
.btn.full{width:100%;padding:15px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.ghost.danger{color:var(--bad);border-color:var(--bad-b)}
.btn.sm{padding:9px 16px;font-size:15px}
.btn:active{transform:translateY(1px)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2>*,.rows>*{min-width:0}
.sd .nm,.card .t{overflow-wrap:break-word}
bdi,.unum{white-space:nowrap}
.sd .no span,.kv b{white-space:nowrap}
.kv b{min-width:0;overflow:hidden;text-overflow:ellipsis;direction:ltr;unicode-bidi:plaintext}
#main{overflow-x:hidden}
.scard .nm,.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.tap{width:100%;text-align:start}

/* dashboard tiles */
.stats{margin-top:26px}
.stat{padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:158px;border-radius:26px}
.stat .chipic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--chip);color:var(--gold)}
.stat .chipic.g{background:var(--green-bg);color:var(--green)}
.stat .lab{font-size:14px;color:var(--mute);line-height:1.3}
.stat .num{font-family:var(--f-latin);font-weight:700;font-size:36px;line-height:1.15;color:var(--gold);direction:ltr;text-align:start}
.trow{display:flex;flex-wrap:nowrap;gap:6px;width:100%}.trow .btn{flex:1 1 0;min-width:0;padding:8px 6px;font-size:12.5px;line-height:1.25;white-space:normal;text-align:center;gap:4px}.trow .btn svg{width:15px;height:15px;flex:none}.esec,.sgrp{border:1px solid var(--line2);border-radius:16px;margin-top:12px;background:var(--surface,transparent)}.esec{padding:0 14px}.esec>summary,.sgrp>summary{list-style:none;cursor:pointer;font-weight:700;padding:14px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px}.sgrp>summary{padding:16px 18px;font-size:17px;font-family:var(--f-head)}.esec>summary::-webkit-details-marker,.sgrp>summary::-webkit-details-marker{display:none}.esec>summary::after,.sgrp>summary::after{content:'';width:9px;height:9px;border-inline-end:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;flex:none;margin-top:-4px}.esec[open]>summary::after,.sgrp[open]>summary::after{transform:rotate(-135deg);margin-top:4px}.sgrp>.sgi{padding:0 18px 18px}.sgrp .card.form{box-shadow:none;border:0;background:none;padding:0;margin:0 0 14px}.sec-h{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px;gap:12px}
.sec-h h2{margin:0;font-size:24px;color:var(--ink);font-weight:700}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--gold-link);font-weight:600}
.rows{display:flex;flex-direction:column;gap:12px}
.row{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:22px}
.row .l{display:flex;align-items:center;gap:14px;min-width:0}
.row .t{font-weight:700;font-size:17px;line-height:1.4}
.row .s{color:var(--mute);font-size:14.5px}
.date{font-family:var(--f-num);color:var(--mute);font-size:16px;white-space:nowrap}
.empty{padding:30px 16px;text-align:center;color:var(--mute)}
.back{display:inline-flex;align-items:center;gap:10px;color:var(--mute);font-size:16px;padding:8px 0}

/* students */
.search{position:relative;margin-top:22px}
.search .ic{position:absolute;top:50%;inset-inline-start:16px;transform:translateY(-50%);color:var(--mute)}
.field,.search input{width:100%;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line2);background:var(--surface);font-size:16px;text-align:start}
.search input{padding-inline-start:50px}
.field::placeholder,.search input::placeholder{color:var(--mute)}
.sgrid{margin-top:20px;gap:16px}
.scard{padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:236px;border-radius:26px;text-align:start}
.scard .num{font-size:34px}.scard .num small{font-size:14px;color:var(--mute);font-weight:400}
.scard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.av{width:56px;height:56px;border-radius:50%;background:var(--chip);border:1.5px solid var(--chip-b);color:var(--gold-d);display:grid;place-items:center;font-family:var(--f-naskh);font-weight:700;font-size:26px;line-height:1;flex:none;padding-top:4px}
.av.sq{border-radius:16px;width:50px;height:50px;font-size:23px}
.av.big{width:76px;height:76px;font-size:36px}
.pill{display:inline-block;font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-bg);border:1.5px solid var(--green-b);border-radius:999px;padding:0 11px;line-height:1.6;white-space:nowrap}
.pill.off{color:var(--mute);background:var(--soft2);border-color:var(--line2)}
.pill.k{color:var(--gold-ink);background:var(--chip);border-color:var(--chip-b)}
.scard .nm{margin-top:6px;font-weight:700;font-size:16px;line-height:1.5}
.scard .no{font-family:system-ui,sans-serif;font-size:13px;color:var(--mute);letter-spacing:.05em;direction:ltr;text-align:start}
.scard .cl{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14.5px}
.rkm{display:inline-flex;align-items:center;gap:4px;color:var(--gold)}
.prog{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;margin-top:auto;padding-top:10px}
.prog .ic{color:var(--gold)}
.bar{height:9px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:99px}

/* student detail */
.sd{padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:center;margin-top:12px;border-radius:26px}
.actrow{display:flex;gap:6px;flex-wrap:nowrap;margin:10px 0 14px}.actrow .btn{width:auto;flex:1 1 auto;min-width:0;min-height:34px;padding:0 8px;font-size:12.5px;gap:3px;box-shadow:none;white-space:normal;line-height:1.2;text-align:center;padding:4px 6px}.actrow .btn svg{display:none}
.sdt{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}.sda{display:flex;align-items:center;gap:8px}.sda .btn{min-height:36px;padding:0 14px;gap:6px;width:auto}.sda .menu-btn{width:38px;height:38px;border:1.5px solid var(--line2);border-radius:12px}
.sdr{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.sdr .chip{flex-direction:column;gap:1px;border-radius:16px;padding:6px 8px;font-size:12.5px;line-height:1.35;text-align:center;justify-content:center;min-width:0}.sdr .sdl{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}.sdr .sdl svg{flex:none}.sdr .sdv{font-size:1.25em}
.sd .nm{font-weight:700;font-size:20px;line-height:1.5}
.sd .cd{color:var(--mute);font-size:14.5px}
.sd .cd.no{font-family:system-ui,sans-serif;letter-spacing:.06em;direction:ltr;text-align:start}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:600;font-size:14px;border:1.5px solid}
.chip.g{color:var(--green);background:var(--green-bg);border-color:var(--green-b)}
.chip.w{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-b)}
.chip.r{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-b)}
.chip.k{color:var(--gold-ink);background:var(--chip);border-color:var(--chip-b)}
.chip.n{color:var(--mute);background:var(--soft2);border-color:var(--line2)}
.tile{padding:16px 8px 14px;text-align:center;border-radius:22px}
.tile .a{color:var(--mute);font-size:14px;line-height:1.35}
.tile .b{font-family:var(--f-latin);font-weight:700;font-size:30px;color:var(--gold);line-height:1.3;direction:ltr}
.tile small{font-size:14px;color:var(--mute);font-family:var(--f-ui);font-weight:400}

/* calendar */
.cal{padding:16px 14px 14px;border-radius:26px;margin-top:14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-h b{font-family:var(--f-head);font-size:20px}

.panel{position:absolute;top:64px;bottom:0;left:0;width:80%;background:var(--surface);transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open .panel{transform:none}
.ptop{padding:18px 22px;border-bottom:1.5px solid var(--line2);color:var(--gold);font-family:var(--f-head);font-size:19px;font-weight:700}
.plist{padding:14px 12px;display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.pbot{padding:12px 12px 16px;border-top:1.5px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.pi{display:flex;align-items:center;gap:16px;padding:13px 18px;border-radius:18px;font-size:16.5px;color:var(--ink);width:100%;text-align:start}
.pi .ic{color:var(--mute)}
.pi.on{background:linear-gradient(90deg,var(--g1),var(--g2));color:var(--on-gold);font-weight:600;box-shadow:var(--shadow)}
.pi.on .ic{color:var(--on-gold)}
.pi.mute{color:var(--mute)}

/* sheet, toast */
.sheet{position:absolute;inset:0;z-index:70;display:flex;align-items:flex-end;background:var(--scrim)}
.sheet[hidden]{display:none}
.sheet-in{width:100%;background:var(--surface);border-radius:28px 28px 0 0;padding:22px 0 22px;max-height:92%;overflow-y:auto}
.sheet h3{margin:0 0 14px;font-family:var(--f-head);font-size:24px;color:var(--gold-ink)}
.sheet p{color:var(--mute);margin:0 0 14px}
.acts{display:flex;gap:12px}
.acts .btn{flex:1}
.toast{position:absolute;z-index:80;bottom:96px;left:50%;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.wait{text-align:center;padding:48px 8px;display:flex;flex-direction:column;align-items:center;gap:14px}
.wait .ic{color:var(--gold)}
.wait h1{font-size:26px}
.wait p{color:var(--mute);margin:0;max-width:34ch}
.unum{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:var(--chip);border:1.5px solid var(--chip-b);color:var(--gold-ink);font-family:system-ui,sans-serif;font-weight:700;letter-spacing:.08em;direction:ltr}
.unum button{color:var(--gold-ink);display:grid;place-items:center}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;color:var(--mute);border-bottom:1px solid var(--line2)}
.kv b{color:var(--ink);font-weight:600;text-align:end;word-break:break-all}

/* sign-in screens */
#auth{position:absolute;inset:0;z-index:60;background:linear-gradient(165deg,var(--au1) 0%,#0B6159 48%,var(--au2) 100%);color:var(--au-t);overflow-y:auto}
#auth[hidden]{display:none}
.au-in{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:44px 32px;position:relative}
.au-logo{width:76px;height:76px;border-radius:50%;border:3px solid var(--au-gold);display:grid;place-items:center;color:var(--au-gold);font-family:var(--f-naskh);font-weight:700;font-size:29px;line-height:1;padding-top:8px;box-shadow:0 0 28px rgba(242,204,69,.25)}
.au-h{margin:0;font-family:var(--f-head);font-size:27px;line-height:1.4;color:var(--au-gold);text-align:center;text-wrap:balance;max-width:20ch;font-weight:700}
#app[lang="ug"] .au-h,#app[lang="ar"] .au-h{font-family:'Lateef','Noto Naskh Arabic',serif;font-size:36px;line-height:1.5;font-weight:700}
.au-sub{margin:-8px 0 0;color:var(--au-t);text-align:center}
.au-card{width:100%;max-width:440px;padding:22px;border-radius:24px;background:var(--au-card);border:1px solid var(--au-b);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.au-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.au-t b{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-size:19px;color:#fff}
.au-t .ic{color:var(--au-gold)}
.au-bk{display:inline-flex;align-items:center;gap:6px;color:var(--au-m)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ltile{display:flex;align-items:center;gap:10px;padding:16px 14px;border-radius:16px;border:1.5px solid var(--au-b);background:rgba(255,255,255,.05);color:var(--au-t);font-weight:600;min-width:0}
.ltile b{font-family:var(--f-ui);font-weight:700;letter-spacing:.04em;font-size:14px;color:#fff}
.ltile[aria-pressed="true"]{border-color:var(--au-gold);background:rgba(242,204,69,.16);color:var(--au-gold)}
.ltile[aria-pressed="true"] b{color:var(--au-gold)}
.au-go{width:100%;padding:15px;border-radius:14px;background:linear-gradient(90deg,#F7DE66,#EBBE2A);color:#2B2100;font-weight:700;font-size:17px;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(240,200,60,.28);margin-top:16px}
#app[dir="rtl"] .au-go .ic{transform:scaleX(-1)}
.rl{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:1.5px solid var(--au-b);background:rgba(255,255,255,.05);width:100%;text-align:start;margin-bottom:12px;color:var(--au-t)}
.rl:last-child{margin-bottom:0}
.rl .bx{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.rl b{display:block;font-family:var(--f-head);font-size:17px;color:#fff}
.rl small{color:var(--au-m);font-size:14px}
.rl .tx{flex:1;min-width:0}
.rl .arr{color:var(--au-m)}
#app[dir="rtl"] .rl .arr{transform:scaleX(-1)}
.au-ico{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#F7DE66,#EBBE2A);display:grid;place-items:center;color:#2B2100}
.au-g{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;padding:13px;border-radius:14px;border:1.5px solid var(--au-b);background:rgba(255,255,255,.07);color:#fff;font-weight:600}
.au-or{display:flex;align-items:center;gap:12px;color:var(--au-m);font-size:13px;margin:16px 0;font-weight:600}
.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:var(--au-b)}
.au-l{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.au-l label{font-weight:600;font-size:14.5px;color:#fff}
.au-lnk{color:var(--au-gold);font-weight:600;font-size:14px}
.au-f{position:relative;margin-bottom:14px}
.au-f .ic{position:absolute;top:50%;inset-inline-start:14px;transform:translateY(-50%);color:var(--au-m)}
.au-f input{width:100%;padding:13px 14px;padding-inline-start:46px;border-radius:14px;border:1.5px solid var(--au-b);background:rgba(255,255,255,.07);color:#fff;font-size:16px}
.au-f input::placeholder{color:rgba(255,255,255,.45)}
.au-f input:focus{outline:0;border-color:var(--au-gold)}
.au-err{color:#FFB9AD;min-height:22px;font-size:14px;text-align:center}
.au-sw{margin:0;color:var(--au-t);text-align:center}
.au-note{margin:0;color:var(--au-m);font-size:13px;text-align:center;max-width:36ch}
.au-chip{position:absolute;top:18px;inset-inline-end:max(16px,env(safe-area-inset-right,0px));padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.25);color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;border:1px solid var(--au-b)}
#auth :focus-visible{outline-color:var(--au-gold)}
/* tablet + desktop: fluid full-screen layout */
@media (min-width:600px){
 body{background:var(--bg)}
 #app{max-width:none;width:100%}
 .grid2{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
 .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
 .card.form,.cal{max-width:760px;margin-inline:auto}
 .sheet{align-items:center;justify-content:center}
 .sheet-in{width:min(560px,92%);border-radius:28px;max-height:88%}
 .panel{width:min(340px,45%)}
 .tabs-in{max-width:none;margin:0 auto}
 #main{padding-inline:max(24px,3vw)}
 .au-card{max-width:min(620px,86%);padding:32px}.au-h{font-size:34px;max-width:28ch}#app[lang="ug"] .au-h,#app[lang="ar"] .au-h{font-size:42px}.au-logo{width:96px;height:96px;font-size:36px}
}
@media (min-width:900px){.rows{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
@media (min-width:1100px){
 .dtw{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
 .dtl,.dtr{min-width:0}.dtr>.grid2{margin-top:0!important;grid-template-columns:repeat(4,minmax(0,1fr))}
 .dtl .cal{max-width:none;margin-top:8px;padding:10px 12px}.dtl .dy{aspect-ratio:auto;height:46px;border-radius:8px;font-size:12px;gap:0}.dtl .cal [class*=grid],.dtl .cal .cg{gap:5px}.dtl .sec-h{margin:10px 0 0}.dtl .sec-h h2{font-size:18px}.dtl .card.sd{padding:12px 16px}.dtr .jzg{gap:6px}
 .dtl .rows,.dtr .rows{grid-template-columns:1fr}
 #main{padding-inline:max(24px,4vw)}
 .page{max-width:1500px;margin-inline:auto}
}
@media (min-width:1100px){
 .sheet-in:has(.enw){width:min(1120px,94%);padding:16px 8px}
 .sheet-in:has(.enw) h3{margin:0 0 4px;font-size:21px}.sheet-in:has(.enw) p.s{margin:0 0 6px}
 .sheet-in:has(.enw) h3,.sheet-in:has(.enw) h3+p.s{display:inline-block;vertical-align:baseline;margin:0 14px 6px}
 .enw{display:flex;flex-direction:column;gap:6px}
 .enl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:20px;align-items:start}
 .enl>.ejg{grid-column:1;grid-row:1/span 2;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin:4px 0}
 .enl>h4,.enl>p{grid-column:2;grid-row:1;margin:0 0 4px!important}
 .enl>.pgg{grid-column:2;grid-row:2;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin:0}
 .enl .ej{padding-block:7px}
 .enl .pgs span{min-height:44px;padding:2px 0;gap:1px}.enl .pgs{padding:3px 2px}
 .enr .seg.res{--n:5!important;gap:5px}.enr .seg.res button{padding:8px 3px;font-size:12px;line-height:1.3}.enr .fld .lbl{margin-bottom:4px}
 .enr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 20px;grid-auto-flow:dense;align-items:start;padding-top:2px}
 .enr>.two{grid-column:1;margin:0!important}.enr>.fld{grid-column:2;margin:0}.enr>[data-act=en-add]{grid-column:2}
 .enr>h4{grid-column:1;margin:4px 0 0!important}.enr>.pend{grid-column:1;margin:0}
 .enr>[data-act=en-save-next]{grid-column:2;margin-top:0!important}
 .enr>[data-act=en-save]{grid-column:2;margin-top:0!important;}
 .enr .btn{padding-block:9px;min-height:0}.enr>.two .btn{padding-block:8px}
}
.fld>.brw{display:flex;flex-wrap:nowrap;align-items:center;gap:8px}.fld>.brw .field{width:72px;min-width:0;text-align:center;padding:8px 6px}.fld>.brw span{white-space:nowrap;font-size:13px}.ball{padding:12px 14px;margin:12px 0 0}.ball .brw{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;margin-top:10px;height:auto;overflow:visible;background:none}.ball .brw .field{width:64px;min-width:0;padding:8px 6px;text-align:center;flex:0 0 auto}.ball .brw select.field{width:auto;flex:1 1 110px}.ball .brw .btn{flex:1 1 100%;margin-top:2px}.bjg{display:grid;grid-template-columns:1fr;gap:6px;margin:12px 0}.bj{display:grid;grid-template-columns:30px 1fr 64px 1fr;gap:8px;align-items:center}.bj b{text-align:center;font-family:var(--f-head)}.bj .field{padding:8px 10px}
@media (min-width:1100px){.sheet-in:has(.bjg){width:min(980px,94%)}.bjg{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px}}
@media (min-width:1700px){.rows{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media print{#app{height:auto;overflow:visible}#main{overflow:visible}.tabs,.tabs-in,.noprint,button.seg,.seg{display:none!important}body{background:#fff}}

['pgLeg',"Yeşil: ezber, mavi: tekrar. Tekrarda ↻ işaretinin yanındaki sayı kaçıncı tekrar olduğunu gösterir (↻1 ilk tekrar, ↻2 ikinci tekrar). Sonra puan yazar. Puanın altındaki kırmızı noktalar yanlış sayısıdır (1 nokta = 1 yanlış, en çok 3 nokta). Gri şerit: sadece okuma notu. Sütun yarıya kadar doluysa o sayfanın yarısı yapılmıştır (sayıda ½ yazar). Geçemeyen dersler sayılmaz.","Green: memorized, blue: revised. The number next to ↻ is the revision round (↻1 first, ↻2 second), then the score. The red dots under the score show the number of mistakes (1 dot = 1 mistake, max 3). Grey strip: reading-only score. A half-filled bar means half of that page was done (shown as ½). Failed lessons are not counted.","الأخضر: حفظ، الأزرق: مراجعة. الرقم بجانب ↻ هو رقم المراجعة (↻1 الأولى، ↻2 الثانية) ثم الدرجة. النقاط الحمراء تحت الدرجة هي عدد الأخطاء (نقطة = خطأ، حتى 3). الشريط الرمادي: درجة القراءة فقط. العمود نصف الممتلئ يعني أن نصف الصفحة أُنجز (يظهر ½). الدروس الراسبة لا تُحسب.","يېشىل: خام ساۋاق، كۆك: تەكرار. تەكرارداكى ↻ بەلگىسىنىڭ يېنىدىكى سان نەچچىنچى قېتىملىق تەكرار ئىكەنلىكىنى بىلدۈرىدۇ (↻1 بىرىنچى، ↻2 ئىككىنچى قېتىم). ئاندىن نومۇر. نومۇرنىڭ ئاستىدىكى قىزىل چېكىتلەر خاتا سانىنى بىلدۈرىدۇ (1 چېكىت = 1 خاتا، ئەڭ كۆپ 3). كۈمۈش رەڭلىك لىنتا: پەقەت ئوقۇش نومۇرى. سۇتۇن يېرىمىغىچە تولغان بولسا بەتنىڭ يېرىمى قىلىنغان (ساندا ½ چىقىدۇ). ئۆتەلمىگەن دەرسلەر ھېسابلانمايدۇ."],

['formula',"Puan = müdürün belirlediği dönemde (hafta, ay veya seçilen tarih aralığı) çocuğun ezber dersine verilen günlük notların (Notlar bölümü, Ezber dersi) toplamıdır. Pasif ve mezun öğrenciler sıralamaya girmez. Eşit puan eşit derece alır.","Points = the sum of the daily scores given to the child's memorization lesson (Grades section, Memorization subject) in the period set by the director (week, month or a chosen date range). Inactive and graduated students are not ranked. Equal points share a rank.","النقاط = مجموع الدرجات اليومية الممنوحة لدرس الحفظ للطفل (قسم الدرجات، مادة الحفظ) خلال الفترة التي يحددها المدير (أسبوع أو شهر أو نطاق تاريخ). لا يُرتَّب الطلاب غير النشطين والخريجون. تتساوى الرتبة عند تساوي النقاط.","نومۇر = مۇدىر بەلگىلىگەن مەزگىلدە (ھەپتە، ئاي ياكى تاللانغان چېسلا ئارىلىقى) بالىنىڭ خام ساۋاق دەرسىگە بېرىلگەن كۈندىلىك باھالارنىڭ (باھا بۆلىكى، خام ساۋاق دەرسى) جەمئىي سانى. پاسسىپ ۋە پۈتتۈرگەن ئوقۇغۇچىلار تىزىمغا كىرمەيدۇ. نومۇر تەڭ بولسا دەرىجە تەڭ بولىدۇ."],

['formulaM',"Ezber derecesi, seçilen dönemde ezberlenen sayfa sayısına göre belirlenir (yarım sayfa 0,5 sayılır). Kalan dersler sayılmaz. Eşit sayfa eşit derece alır. Pasif ve mezun öğrenciler sıralamaya girmez.","Memorization rank is based on pages memorized in the selected period (a half page counts as 0.5). Failed lessons do not count. Equal pages share a rank. Inactive and graduated students are not ranked.","يُحدَّد ترتيب الحفظ بعدد الصفحات المحفوظة في الفترة المحددة (نصف الصفحة يُحسب 0.5). الدروس غير المجتازة لا تُحسب. تتساوى الرتبة عند تساوي الصفحات. لا يُرتَّب الطلاب غير النشطين والخريجون.","خام ساۋاق دەرىجىسى تاللانغان مەزگىلدە خام ساۋاق ئىشلەنگەن بەت سانىغا ئاساسەن بېكىتىلىدۇ (يېرىم بەت 0.5 ھېسابلىنىدۇ). ئۆتەلمىگەن دەرسلەر ھېسابقا كىرمەيدۇ. بەت سانى تەڭ بولسا دەرىجە تەڭ بولىدۇ. پاسسىپ ۋە پۈتتۈرگەن ئوقۇغۇچىلار تىزىمغا كىرمەيدۇ."],

function login(u){S.session=u.id;gSel=0;save();location.hash='';render()}
function mkUser(role,name,email,pass){const u={id:nextId(),uno:'USR-'+(100000+S.nid),role,name,email:email.toLowerCase(),pass,sch:null};S.users.push(u);return u}
function authSubmit(){
 if(CLOUD)return cloudAuthSubmit();
 const em=$('#auEmail').value.trim().toLowerCase(),pw=$('#auPass').value,err=m=>{$('#auErr').textContent=t(m)};
 if(AU.mode==='register'){
  const nm=$('#auName').value.trim();
  if(!nm||!em||!pw)return err('errFields');
  if(!/^\S+@\S+\.\S+$/.test(em))return err('errMail');
  if(pw.length<6)return err('errPass');
  if(S.users.some(u=>u.email===em))return err('errExists');
  login(mkUser(AU.role,nm,em,pw));
 }else{
  if(!em||!pw)return err('errFields');
  const u=S.users.find(x=>x.email===em&&x.pass===pw);
  if(!u)return err('errLogin');
  if(u.role!==AU.role)return err('errRole');
  login(u);
 }
}

function googleGo(){

async function repSave(name,data,mime){

function annFileRead(f){const er=$('#shErr'),nm=$('#annFN');if(!f)return;er.textContent='';const MAX=700*1024;
 const done=(data,name)=>{if(data.length*0.75>MAX){er.textContent=t('annFileBig');annPend=null;nm.textContent='';return}annPend={name,type:f.type,data};nm.textContent=name};
 if(/^image\//.test(f.type)){const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let w=im.width,h=im.height,m=1280;if(w>m||h>m){const r=m/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length*0.75>MAX&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}URL.revokeObjectURL(u);done(d,f.name.replace(/\.[^.]+$/,'')+'.jpg')};im.onerror=()=>{er.textContent=t('annFileBig')};im.src=u;return}
 if(f.size>MAX){er.textContent=t('annFileBig');annPend=null;nm.textContent='';return}
 const r=new FileReader();r.onload=()=>done(r.result,f.name);r.readAsDataURL(f)}

 if(!force){try{if(localStorage.getItem('ikra-tip-seen')===day)return}catch(e){}}

 o.addEventListener('click',()=>{o.remove();if(!force){try{localStorage.setItem('ikra-tip-seen',day)}catch(e){}}});document.body.appendChild(o);fit()}
